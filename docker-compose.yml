services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memed-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/memed_payout
      - JWT_SECRET=memed_super_secret_jwt_key_production_2026
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: memed-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend

  mongodb:
    image: mongo:7-jammy
    container_name: memed-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: memed-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mongo-data:
